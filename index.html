<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>كود بلا كود - GitHub Edition - Ahmed M Tork</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');body{font-family:Cairo}</style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen">
<div class="max-w-6xl mx-auto p-6">
<header class="flex justify-between items-center py-4 border-b border-white/10">
<div><h1 class="text-3xl font-black">كود بلا كود <span class="text-amber-400">WEB</span></h1><p class="text-white/60 text-sm">نسخة Vercel الرسمية - مختومة</p></div>
<div class="text-left text-xs font-mono bg-white/10 px-3 py-2 rounded">SEAL: AMSAHOT1791997<br/>OWNER: Ahmed M Tork</div>
</header>
<div class="grid md:grid-cols-2 gap-6 mt-8">
<div id="drop" class="border-2 border-dashed border-amber-500/50 rounded-2xl p-10 text-center bg-amber-500/5 hover:bg-amber-500/10 cursor-pointer">
<p class="text-xl">اسحب ملف ZIP هنا</p><p class="text-white/50 text-sm mt-2">هيشتغل اوتوماتيك بدون نت</p><input id="file" type="file" accept=".zip" class="hidden"/>
</div>
<div class="bg-white/5 rounded-2xl p-4">
<h3 class="font-bold mb-2">المعاينة</h3>
<iframe id="preview" class="w-full h-[300px] bg-white rounded-xl"></iframe>
<div id="log" class="mt-3 text-xs font-mono text-green-400 h-24 overflow-auto"></div>
</div>
</div>
</div>

<div style="position:fixed;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);border:1px solid #f59e0b;color:#fbbf24;padding:8px 14px;border-radius:12px;font-family:monospace;font-size:11px;z-index:9999">
  <span>© Ai VS ME | كود بلا كود | AMSAHOT1791997 | Ahmed M Tork</span>
  <span style="background:#f59e0b;color:black;padding:2px 8px;border-radius:6px;font-weight:bold">OFFICIAL SEALED</span>
</div>
<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-25deg);font-size:80px;font-weight:900;color:rgba(245,158,11,0.04);pointer-events:none;z-index:0;white-space:nowrap">AMSAHOT1791997 - Ahmed M Tork</div>

<script>
const drop=document.getElementById('drop'),fileIn=document.getElementById('file'),preview=document.getElementById('preview'),log=document.getElementById('log');
function addLog(t){log.innerHTML+=`> ${t}<br>`;log.scrollTop=log.scrollHeight}
drop.onclick=()=>fileIn.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('bg-amber-500/20')};
drop.ondragleave=()=>drop.classList.remove('bg-amber-500/20');
drop.ondrop=async e=>{e.preventDefault();handle(e.dataTransfer.files[0])};
fileIn.onchange=e=>handle(e.target.files[0]);
async function handle(f){if(!f)return;addLog(`فك ضغط: ${f.name} - AMSAHOT1791997`);const zip=await JSZip.loadAsync(f);let htmlFile=null;let count=0;zip.forEach((p,file)=>{count++;if(p.toLowerCase().endsWith('index.html'))htmlFile=file});addLog(`لقيت ${count} ملف`);if(htmlFile){const txt=await htmlFile.async('string');preview.srcdoc=txt;addLog('✅ المشروع اشتغل - Ahmed M Tork')}else{addLog('⚠️ مفيش index.html، عرض قائمة الملفات');let list='';zip.forEach(p=>{list+=p+'<br>'});preview.srcdoc=`<pre style="color:black;padding:20px">${list}</pre>`}}
</script>
</body></html>
